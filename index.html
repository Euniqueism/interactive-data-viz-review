<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Data Visualization — Semester Review</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --badge-bg: #eff6ff;
      --badge-text: #1d4ed8;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.06);
    }

    body.dark {
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --badge-bg: rgba(59, 130, 246, 0.15);
      --badge-text: #93c5fd;
      --shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: background-color 0.2s, color 0.2s;
    }

    /* Passcode Gate Overlay */
    #passcode-gate {
      position: fixed;
      inset: 0;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 1rem;
    }

    .gate-card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 2rem;
      border-radius: 14px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.45);
    }

    .gate-card h2 {
      margin: 0 0 0.5rem;
      font-size: 1.3rem;
    }

    .gate-card p {
      margin: 0 0 1.25rem;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .gate-card input {
      width: 100%;
      padding: 0.7rem 0.85rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #ffffff;
      font-size: 0.95rem;
      margin-bottom: 0.75rem;
    }

    .gate-card input:focus {
      outline: 2px solid #3b82f6;
      border-color: transparent;
    }

    .gate-card button {
      width: 100%;
      padding: 0.7rem;
      border-radius: 8px;
      border: none;
      background: #3b82f6;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .gate-card button:hover {
      background: #2563eb;
    }

    #passcode-error {
      color: #f87171;
      font-size: 0.85rem;
      margin: 0.75rem 0 0;
      display: none;
    }

    /* Main Portal Layout */
    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.85rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-secondary:hover {
      border-color: var(--accent);
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      margin-bottom: 2rem;
    }

    #search-input {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }

    #search-input:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .filter-btn {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.35rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow);
    }

    .badge {
      display: inline-block;
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      margin-bottom: 0.65rem;
    }

    .card h3 {
      margin: 0 0 0.5rem;
      font-size: 1.1rem;
    }

    .card p {
      margin: 0 0 1.25rem;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .slide-link {
      display: inline-block;
      text-align: center;
      text-decoration: none;
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.55rem 0.9rem;
      border-radius: 8px;
      transition: background-color 0.15s;
    }

    .slide-link:hover {
      background: var(--accent-hover);
    }

    #empty-state {
      display: none;
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <!-- Passcode Gate -->
  <div id="passcode-gate">
    <div class="gate-card">
      <h2>Class Review Access</h2>
      <p>Enter the semester passcode to view the lecture slides and notes.</p>
      <input id="passcode-input" type="password" placeholder="Enter passcode" autocomplete="off" />
      <button type="button" onclick="checkPasscode()">Unlock Slides</button>
      <p id="passcode-error">Incorrect passcode. Please try again.</p>
    </div>
  </div>

  <!-- Main Study Portal -->
  <div class="container">
    <header>
      <div>
        <h1>Interactive Data Visualization</h1>
        <p class="subtitle">Semester Review — Lectures 1 through 15</p>
      </div>
      <div class="header-actions">
        <button class="btn-secondary" type="button" onclick="toggleTheme()">Toggle Theme</button>
        <button class="btn-secondary" type="button" onclick="lockSite()">Lock</button>
      </div>
    </header>

    <div class="controls">
      <input id="search-input" type="text" placeholder="Search lectures, tools (e.g., Datawrapper, Flourish, Google Sheets), or concepts..." oninput="renderLectures()" />
      <div class="filters">
        <button class="filter-btn active" data-module="all" onclick="setModule('all', this)">All Modules (14)</button>
        <button class="filter-btn" data-module="1" onclick="setModule('1', this)">Module 1: Foundations</button>
        <button class="filter-btn" data-module="2" onclick="setModule('2', this)">Module 2: Storytelling</button>
        <button class="filter-btn" data-module="3" onclick="setModule('3', this)">Module 3: Tools &amp; Charts</button>
        <button class="filter-btn" data-module="4" onclick="setModule('4', this)">Module 4: Geospatial &amp; Final</button>
      </div>
    </div>

    <div id="lecture-grid" class="grid"></div>
    <div id="empty-state">No lectures matched your search. Try another keyword or reset the module filter.</div>
  </div>

  <script>
    // ==========================================
    // 1. SET YOUR PASSCODE HERE
    // ==========================================
    const PASSCODE = "dataviz2026";

    if (sessionStorage.getItem("unlocked") === "true") {
      document.getElementById("passcode-gate").style.display = "none";
    }

    function checkPasscode() {
      const input = document.getElementById("passcode-input").value.trim();
      if (input === PASSCODE) {
        sessionStorage.setItem("unlocked", "true");
        document.getElementById("passcode-gate").style.display = "none";
        document.getElementById("passcode-error").style.display = "none";
      } else {
        document.getElementById("passcode-error").style.display = "block";
      }
    }

    function lockSite() {
      sessionStorage.removeItem("unlocked");
      document.getElementById("passcode-input").value = "";
      document.getElementById("passcode-gate").style.display = "flex";
    }

    document.getElementById("passcode-input").addEventListener("keypress", function (e) {
      if (e.key === "Enter") checkPasscode();
    });

    // ==========================================
    // 2. LECTURE DATA (ALL 15 LECTURES)
    // ==========================================
    const lectures = [
      {
        num: "Lecture 1",
        module: "1",
        moduleName: "Module 1: Foundations",
        title: "History of Data Visualization",
        desc: "Evolution of visual storytelling, historical milestones (Nightingale, Minard, John Snow), and turning raw data into human insight.",
        url: "https://pitch.com/v/li_class-1---interactive-visualization---history-of-data-visualization-hxsjtt"
      },
      {
        num: "Lecture 2",
        module: "1",
        moduleName: "Module 1: Foundations",
        title: "Methods of Encoding",
        desc: "Mapping data variables to visual channels (position, length, area, angle, color) and perceptual accuracy across chart forms.",
        url: "https://app.pitch.com/app/presentation/5f587211-523c-4934-811b-166d7aca192d/57d46f42-96a0-4f13-9793-5ff714837403"
      },
      {
        num: "Lectures 3 & 4",
        module: "1",
        moduleName: "Module 1: Foundations",
        title: "Proper Scaling, Sizing & Constructive Critiques",
        desc: "Zero-baselines vs. truncated axes, proportional area scaling, avoiding visual distortion, and giving actionable design critiques.",
        url: "https://pitch.com/v/sept-2--interactive-visualization---constructive-critiques-j3cgsp/699affdf-ff98-41dc-829b-312b032fc807"
      },
      {
        num: "Lecture 5",
        module: "2",
        moduleName: "Module 2: Storytelling",
        title: "Design Decisions & Writing Style",
        desc: "Balancing artistry versus efficiency, reducing chartjunk, typography, color hierarchy, and writing clear headlines and annotations.",
        url: "https://pitch.com/v/sept9_lecture-5_-interactive-visualization---artistry-v-efficiency-writing-style-mk3xi7"
      },
      {
        num: "Lecture 6",
        module: "2",
        moduleName: "Module 2: Storytelling",
        title: "Types of Data Stories",
        desc: "Narrative structures in data journalism: trend over time, comparison, outlier/anomaly, part-to-whole, and intersecting relationships.",
        url: "https://pitch.com/v/sept-16---interactive-visualization---types-of-data-stories-s8vm39/4c81cb75-a72d-4bed-b1ab-d581aed070e7"
      },
      {
        num: "Lecture 7",
        module: "2",
        moduleName: "Module 2: Storytelling",
        title: "Data Literacy & Personal Data Stories",
        desc: "Evaluating data credibility, understanding context and bias, translating personal datasets into narratives, and peer feedback workflows.",
        url: "https://pitch.com/v/sept16_lecture7-interactive-visualization---personal-data-story-peer-feedback-knavge"
      },
      {
        num: "Lecture 8",
        module: "3",
        moduleName: "Module 3: Tools & Charts",
        title: "Data Story Reading & Intro to Google Sheets",
        desc: "Deconstructing published data stories alongside foundational spreadsheet skills: sorting, filtering, formatting, and basic formulas.",
        url: "https://pitch.com/v/sept-23_lecture8_interactive-visualization---intro-to-google-sheets-i5ju9e/c8ea3514-6928-4279-a2c8-db89b62e20b0"
      },
      {
        num: "Lecture 9",
        module: "3",
        moduleName: "Module 3: Tools & Charts",
        title: "Google Sheets Practice (Part 2)",
        desc: "Intermediate data cleaning and aggregation: pivot tables, VLOOKUP/XLOOKUP, conditional logic, and restructuring data for charting.",
        url: "https://pitch.com/v/sept-30_lecture9_interactive-visualization---google-sheets-pt-2-x8dfws"
      },
      {
        num: "Lecture 10",
        module: "3",
        moduleName: "Module 3: Tools & Charts",
        title: "Chart Selection & Intro to Datawrapper",
        desc: "Matching data relationships to the right chart type (bar, line, scatter, table) and building clean, responsive charts in Datawrapper.",
        url: "https://pitch.com/v/sept30_lecture_10interactive-visualization---intro-to-datawrapper-br8eg4/6ec8525c-ab71-475c-98ef-f3fb81521243"
      },
      {
        num: "Lecture 11",
        module: "3",
        moduleName: "Module 3: Tools & Charts",
        title: "Datawrapper Practice, Metadata & Data Dictionaries",
        desc: "Documenting datasets with data dictionaries (variables, units, sources), citing metadata properly, and customizing interactive tooltips.",
        url: "https://pitch.com/v/oct-7_lecture-11---interactive-visualization---datawrapper-data-dictionaries-5zzzep/c468bd9b-478f-41f6-98af-ca5470c84cfa"
      },
      {
        num: "Lecture 12",
        module: "3",
        moduleName: "Module 3: Tools & Charts",
        title: "Common Chart Mistakes & Intro to Flourish",
        desc: "Troubleshooting misleading visuals (dual axes, rainbow color maps, overcrowded pies) and creating interactive visuals in Flourish.",
        url: "https://pitch.com/v/oct14_-lecture-12---interactive-visualization---problems-to-avoid-6u6ajd"
      },
      {
        num: "Lecture 13",
        module: "4",
        moduleName: "Module 4: Geospatial & Final",
        title: "Geospatial Data (Part 1)",
        desc: "Fundamentals of geographic visualization, map projections, coordinate systems, and choosing between choropleth and point maps.",
        url: "https://pitch.com/v/oct-21---lecture-13---interactive-visualization-xerh5k/de3a05ba-4270-442e-8556-89f805a868de"
      },
      {
        num: "Lecture 14",
        module: "4",
        moduleName: "Module 4: Geospatial & Final",
        title: "Geospatial Data (Part 2)",
        desc: "Hands-on mapping workflows, normalizing geographic data (rates vs. raw counts), GeoJSON/shapefiles, and color binning strategies.",
        url: "https://pitch.com/v/oct-28---lecture-14---geospatial-mapping-practice-2-d6v94q/8d3543cb-6972-49ee-b172-8869e2a868de"
      },
      {
        num: "Lecture 15",
        module: "4",
        moduleName: "Module 4: Geospatial & Final",
        title: "Data Story Visualization Development",
        desc: "Synthesizing research, data cleaning, visual hierarchy, and interactive embeds into a cohesive end-to-end final data story.",
        url: "https://pitch.com/v/lecture-15---data-story-continued-nov-4-2v75jt/44deabf5-7f87-48df-9a46-e57bb07c8160"
      }
    ];

    // ==========================================
    // 3. FILTERING, SEARCH & THEME LOGIC
    // ==========================================
    let currentModule = "all";

    function setModule(mod, btn) {
      currentModule = mod;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderLectures();
    }

    function renderLectures() {
      const query = document.getElementById("search-input").value.toLowerCase().trim();
      const grid = document.getElementById("lecture-grid");
      const empty = document.getElementById("empty-state");

      const filtered = lectures.filter(item => {
        const matchesModule = currentModule === "all" || item.module === currentModule;
        const matchesSearch =
          item.num.toLowerCase().includes(query) ||
          item.title.toLowerCase().includes(query) ||
          item.desc.toLowerCase().includes(query) ||
          item.moduleName.toLowerCase().includes(query);
        return matchesModule && matchesSearch;
      });

      grid.innerHTML = filtered.map(item => `
        <article class="card">
          <div>
            <span class="badge">${item.num} &bull; ${item.moduleName.split(": ")[1]}</span>
            <h3>${item.title}</h3>
            <p>${item.desc}</p>
          </div>
          <a class="slide-link" href="${item.url}" target="_blank" rel="noopener noreferrer">Open Pitch Slides &rarr;</a>
        </article>
      `).join("");

      empty.style.display = filtered.length === 0 ? "block" : "none";
    }

    function toggleTheme() {
      document.body.classList.toggle("dark");
    }

    renderLectures();
  </script>
</body>
</html>
